<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - ONG Amor ao Próximo</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <h1>ONG Amor ao Próximo</h1>

      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Seja um colaborador</a>
      </nav>
    </header>
    <main class="grid">
      <h2 class="titulo-pagina">Seja um colaborador</h2>
      <img
        class="imagem-pagina"
        src="../imagens/colabore.png"
        alt="Famílias recebendo cestas básicas em uma ação solidária"
      />

      <form class="formulario">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            placeholder="(83) 99999-9999"
            required
          />

          <label for="cpf">CPF:</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            placeholder="000.000.000-00"
            required
          />

          <label for="data-nascimento">Data de nascimento:</label>
          <input
            type="date"
            id="data-nascimento"
            name="data-nascimento"
            required
          />
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>
          <label for="cep">CEP:</label>
          <input
            type="text"
            id="cep"
            name="cep"
            pattern="[0-9]{5}-[0-9]{3}"
            placeholder="58000-000"
            required
          />

          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" required />

          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" required />

          <label for="estado">Estado:</label>
          <input type="text" id="estado" name="estado" required />
        </fieldset>
        <fieldset>
          <legend>Forma de Contribuição</legend>
          <label for="contribuicao">Como deseja contribuir?</label>

          <select id="contribuicao" name="contribuicao" required>
            <option value="">Selecione uma opção</option>
            <option value="doacao-financeira">Doação financeira</option>
            <option value="doacao-materiais">Doação de materiais</option>
            <option value="voluntariado">Trabalho voluntário</option>
          </select>
        </fieldset>
        <button type="submit">Enviar cadastro</button>
        <div class="toast" id="toast">Cadastro enviado com sucesso!</div>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 ONG Amor ao Próximo - Todos os direitos reservados.</p>
    </footer>
    <script src="../js/mascaras.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/validacao.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/projetos.js"></script>
  </body>
</html>
